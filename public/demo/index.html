<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慢物设计 · 动效示例</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f6f0; color: #293a2a; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .page { padding: 25px 7% 20px; min-height: 100vh; overflow: hidden; }
    nav { display: flex; align-items: center; justify-content: space-between; font-size: 9px; color: #7a8270; }
    .wordmark { font-size: 12px; font-weight: 650; letter-spacing: 2px; color: #3c5038; }
    .nav-links { display: flex; gap: 18px; }
    main { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 28px; min-height: calc(100vh - 101px); padding: 33px 0; }
    h1 { font-family: "Songti SC", "STSong", "SimSun", serif; font-weight: 500; font-size: clamp(26px, 4.2vw, 55px); line-height: 1.5; letter-spacing: 1px; margin: 0 0 17px; }
    .description { font-size: clamp(9px,1.25vw,12px); color: #7d8672; line-height: 2; margin: 0 0 24px; max-width: 260px; }
    .action { border: 0; background: #344e32; color: #f6f7ef; padding: 11px 16px; border-radius: 3px; font: inherit; font-size: 10px; display: inline-flex; align-items: center; gap: 23px; }
    .action svg { width: 14px; height: 14px; }
    .art { position: relative; background: #e5e8d9; aspect-ratio: .93; border-radius: 90px 90px 4px 4px; max-height: 330px; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .sculpture { width: 65%; height: 78%; position: relative; }
    .sculpture span { display: block; position: absolute; box-shadow: 9px 13px 17px #3e512720; }
    .shape-a { width: 48%; height: 63%; top: 4%; left: 8%; border-radius: 100px 100px 5px 5px; background: #6b7d53; transform: rotate(-16deg); }
    .shape-b { width: 48%; height: 48%; right: 0; top: 33%; border-radius: 50%; background: #c9b187; }
    .shape-c { width: 67%; height: 23%; bottom: 0; left: 1%; border-radius: 3px; background: #eff0df; transform: rotate(-10deg); }
    .art-caption { position: absolute; bottom: 16px; left: 18px; font-size: 7px; color: #5d704b; letter-spacing: 2px; }
    footer { display: flex; justify-content: space-between; font-size: 7px; color: #9aa18c; letter-spacing: .5px; border-top: 1px solid #e2e5d7; padding-top: 15px; }
    [data-motion-id] { will-change: transform, opacity; }
    @media (max-width: 450px) { .page { padding: 18px 7%; } main { gap: 16px; padding: 28px 0; } h1 { font-size: 25px; margin-bottom: 12px; }.description { font-size: 9px; margin-bottom: 18px; }.art { border-radius: 60px 60px 4px 4px; aspect-ratio: .7; }.nav-links { gap: 10px; font-size: 8px; }.action { font-size: 9px; padding: 9px 12px; gap: 12px; }.art-caption { font-size: 6px; left: 12px; letter-spacing: 1px; } }
    @media (max-height: 290px) { .page { padding-top: 14px; } main { padding: 18px 0; min-height: 0; }.art { max-height: 155px; width: auto; }h1 { font-size: 24px; margin-bottom: 10px; }.description { margin-bottom: 12px; font-size: 9px; }.action { padding: 8px 12px; }footer { padding-top: 10px; } }
    nav, .nav-links, .description, .action { font-size: 11px; }
    .description, .nav-links { color: #65705b; }
    footer, .art-caption { font-size: 10px; color: #626f51; letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="page">
    <nav><span class="wordmark">慢物设计</span><div class="nav-links"><span>我们的作品</span><span>关于慢物</span></div></nav>
    <main>
      <section><h1 data-motion-id="title">让好设计，<br>自然发生。</h1><p class="description" data-motion-id="description">留一点空间，给真正重要的事物。<br>我们用克制的设计，让日常多一点美好。</p><button class="action" data-motion-id="action">探索作品<svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="M3 10h13m-5-5 5 5-5 5"/></svg></button></section>
      <div class="art" data-motion-id="composition"><div class="sculpture"><span class="shape-a"></span><span class="shape-b"></span><span class="shape-c"></span></div><span class="art-caption">形态 · 秩序 · 平衡</span></div>
    </main>
    <footer><span>独立设计工作室</span><span>动效演示页面 · 示例内容</span></footer>
  </div>
  <script type="module">
    import { demoScene, transformString, easingString } from "/scene.js";
    window.__MOTION_SCENE__ = demoScene;
    for (const track of demoScene.tracks) {
      document.querySelector(`[data-motion-id="${track.id}"]`).animate([
        { transform: transformString(track.from), opacity: track.from.opacity },
        { transform: transformString(track.to), opacity: track.to.opacity }
      ], { duration: track.duration, delay: track.delay, easing: easingString(track.easing), fill: "both" });
    }
    await import("/bridge.js");
  </script>
</body>
</html>
